<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpineHUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #38bdf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 3rem;
        }

        .diagram {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            max-width: 100%;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .node {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: default;
            transition: all 0.3s;
            position: relative;
        }

        .node:hover {
            transform: scale(1.15);
            border-color: #818cf8;
            box-shadow: 0 0 30px rgba(129,140,248,0.3);
        }

        .node:hover::after {
            content: attr(data-label);
            position: absolute;
            bottom: -22px;
            font-size: 0.65rem;
            color: #94a3b8;
            white-space: nowrap;
        }

        .node.core {
            width: 90px;
            height: 90px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            border: none;
            box-shadow: 0 0 40px rgba(99,102,241,0.4);
        }

        .node.core:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(99,102,241,0.6);
        }

        .arrow {
            color: #334155;
            font-size: 1.2rem;
        }

        .arrow-down {
            font-size: 1.5rem;
            color: #334155;
            margin: 0.3rem 0;
        }

        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding: 1.5rem;
            border-radius: 16px;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .section-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .branch {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .branch-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .mini-row {
            display: flex;
            gap: 0.4rem;
        }

        .mini-node {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }

        .mini-node:hover::after {
            content: attr(data-label);
            position: absolute;
            bottom: -18px;
            font-size: 0.55rem;
            color: #64748b;
            white-space: nowrap;
        }

        footer {
            margin-top: 3rem;
            color: #334155;
            font-size: 0.7rem;
        }

        footer a {
            color: #6366f1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>SpineHUB</h1>
    <p class="subtitle">Central de Inteligencia</p>

    <div class="diagram">

        <!-- INPUTS -->
        <div class="section">
            <div class="section-label">Fontes</div>
            <div class="row">
                <div class="node" data-label="Slack">💬</div>
                <div class="arrow">→</div>
                <div class="node" data-label="Linear">📋</div>
                <div class="arrow">→</div>
                <div class="node" data-label="Claude">🤖</div>
                <div class="arrow">→</div>
                <div class="node" data-label="Drive">📁</div>
                <div class="arrow">→</div>
                <div class="node" data-label="Local">💻</div>
            </div>
        </div>

        <div class="arrow-down">▼</div>

        <!-- COLLECTORS -->
        <div class="row">
            <div class="node" data-label="Coletar">📥</div>
            <div class="arrow">→</div>
            <div class="node" data-label="Filtrar">🔍</div>
            <div class="arrow">→</div>
            <div class="node" data-label="Normalizar">⚡</div>
        </div>

        <div class="arrow-down">▼</div>

        <!-- CORE -->
        <div class="node core" data-label="SpineHUB">🧠</div>

        <div class="arrow-down">▼</div>

        <!-- PROCESSING -->
        <div class="row">
            <div class="node" data-label="Grafo">🕸️</div>
            <div class="arrow">↔</div>
            <div class="node" data-label="Memoria">💾</div>
            <div class="arrow">↔</div>
            <div class="node" data-label="Analise">📊</div>
        </div>

        <div class="arrow-down">▼</div>

        <!-- OUTPUTS -->
        <div class="section">
            <div class="section-label">Saidas</div>
            <div class="row">
                <div class="node" data-label="Tickets">🎫</div>
                <div class="arrow">←</div>
                <div class="node" data-label="Docs">📝</div>
                <div class="arrow">←</div>
                <div class="node" data-label="Git">🔄</div>
                <div class="arrow">←</div>
                <div class="node" data-label="Release">🚀</div>
                <div class="arrow">←</div>
                <div class="node" data-label="Sync">🔗</div>
            </div>
        </div>

        <!-- BRANCHES -->
        <div class="branch">
            <div class="branch-item">
                <div class="arrow-down">▼</div>
                <div class="section-label">Seguranca</div>
                <div class="mini-row">
                    <div class="mini-node" data-label="Ruff">🔧</div>
                    <div class="mini-node" data-label="Bandit">🛡️</div>
                    <div class="mini-node" data-label="Vulture">🦅</div>
                    <div class="mini-node" data-label="Radon">📈</div>
                </div>
            </div>

            <div class="branch-item">
                <div class="arrow-down">▼</div>
                <div class="section-label">APIs</div>
                <div class="mini-row">
                    <div class="mini-node" data-label="GitHub">🐙</div>
                    <div class="mini-node" data-label="Anthropic">🅰️</div>
                    <div class="mini-node" data-label="Google">🔵</div>
                    <div class="mini-node" data-label="QuickBooks">💰</div>
                </div>
            </div>

            <div class="branch-item">
                <div class="arrow-down">▼</div>
                <div class="section-label">Projetos</div>
                <div class="mini-row">
                    <div class="mini-node" data-label="TSA">📦</div>
                    <div class="mini-node" data-label="GEM">💎</div>
                    <div class="mini-node" data-label="QBO">📊</div>
                    <div class="mini-node" data-label="+4">➕</div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <a href="https://github.com/thiagotbx123/SpineHUB">GitHub</a> · v3.1
    </footer>
</body>
</html>
